function resize() {
  const wrap = canvas.parentElement;
  const maxW = wrap.clientWidth - 48;
  const maxH = wrap.clientHeight - 48;
  const aspect = 1080 / 1350;
  let w, h;
  if (maxW / maxH > aspect) {
    h = maxH;
    w = h * aspect;
  } else {
    w = maxW;
    h = w / aspect;
  }
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = 1080;
  canvas.height = 1350;
}

window.addEventListener('resize', resize);

// Randomize helper: lerp a value toward a random variant based on rand %
function vary(base, amount) {
  const r = cfg.rand / 100;
  return base * (1 + (Math.random() * 2 - 1) * amount * r);
}

// "<3" drawn as line-segment text

class Heart {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.age = 0;
    this.alive = true;
    this.lifespan = vary(cfg.life, 0.4);
    this.scale = vary(cfg.len / 45, 0.5);
    this.riseSpeed = vary(cfg.rise * 40, 0.3);
    this.swayPhase = Math.random() * Math.PI * 2;
    this.swayAmount = cfg.speed * 12;
    this.swayFreq = vary(1.2, 0.3);
    this.rotation = -Math.PI / 2 + (Math.random() - 0.5) * 0.4;
    this.rotSpeed = (Math.random() - 0.5) * 0.3;
    this.color = randColors ? randomHex() : cfg.color;
  }
  update(dt) {
    this.age += dt;
    if (this.age >= this.lifespan) {
      this.alive = false;
      return;
    }
    this.y -= this.riseSpeed * dt;
    this.x += Math.sin(this.age * this.swayFreq * Math.PI * 2 + this.swayPhase) * this.swayAmount * dt;
    this.rotation += this.rotSpeed * dt;
  }
  draw() {
    const progress = this.age / this.lifespan;
    let sc = this.scale;
    // Shrink toward end of life
    if (progress > 0.65) {
      sc *= 1 - (progress - 0.65) / 0.35;
    }
    if (sc < 0.01) return;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.lineWidth = cfg.stroke;
    ctx.strokeStyle = this.color;

    // < part
    ctx.beginPath();
    ctx.moveTo(6 * sc, -37 * sc);
    ctx.lineTo(-29 * sc, 0);
    ctx.lineTo(6 * sc, 37 * sc);
    ctx.stroke();

    // top arc of 3
    ctx.beginPath();
    ctx.arc(11 * sc, -19 * sc, 18 * sc, Math.PI / 2, -Math.PI / 2, true);
    ctx.stroke();

    // bottom arc of 3
    ctx.beginPath();
    ctx.arc(11 * sc, 19 * sc, 18 * sc, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();

    ctx.restore();
  }
}

// Compute glyph widths from segments
const charWidths = {};
for (const [ch, segs] of Object.entries(charSegs)) {
  if (!segs) { charWidths[ch] = 20; continue; }
  let maxX = 0;
  for (const s of segs) { maxX = Math.max(maxX, s[0], s[2]); }
  charWidths[ch] = maxX;
}

// Draw a string as line segments. (x,y) = left baseline, sc = scale factor
function drawLineText(text, x, y, sc, color, gap) {
  ctx.strokeStyle = color;
  gap = gap || 12;
  let cx = x;
  for (const ch of text) {
    const segs = charSegs[ch];
    if (!segs) { cx += (20 + gap) * sc; continue; }
    for (const s of segs) {
      ctx.beginPath();
      ctx.moveTo(cx + s[0] * sc, y + s[1] * sc);
      ctx.lineTo(cx + s[2] * sc, y + s[3] * sc);
      ctx.stroke();
    }
    cx += (charWidths[ch] + gap) * sc;
  }
  return cx - x; // total width drawn
}

// Measure line text width without drawing
function measureLineText(text, sc, gap) {
  gap = gap || 12;
  let w = 0;
  for (const ch of text) {
    w += ((charWidths[ch] || 20) + gap) * sc;
  }
  return w - gap * sc;
}

// Draw centered line text
function drawLineTextCentered(text, cx, y, sc, color, gap) {
  const w = measureLineText(text, sc, gap);
  drawLineText(text, cx - w / 2, y, sc, color, gap);
}

  ctx.strokeStyle = color;
  ctx.lineWidth = cfg.stroke;

  // Head
  ctx.beginPath();
  ctx.arc(0, headY, headR, 0, Math.PI * 2);
  ctx.stroke();

  // Body
  ctx.beginPath();
  ctx.moveTo(0, -h + 71 * s);
  ctx.lineTo(0, -h + 136 * s);
  ctx.stroke();

  // Left arm — reaches out to neighbor
  ctx.beginPath();
  ctx.moveTo(-2.5 * s, -h + 66 * s);
  ctx.lineTo(-60 * s, -h + 100 * s);
  ctx.stroke();

  // Right arm — reaches out to neighbor
  ctx.beginPath();
  ctx.moveTo(2.5 * s, -h + 66 * s);
  ctx.lineTo(60 * s, -h + 100 * s);
  ctx.stroke();

  // Left leg
  ctx.beginPath();
  ctx.moveTo(-2.5 * s, -h + 138.5 * s);
  ctx.lineTo(-47.5 * s, 0);
  ctx.stroke();

  // Right leg
  ctx.beginPath();
  ctx.moveTo(2.5 * s, -h + 138.5 * s);
  ctx.lineTo(47.5 * s, 0);
  ctx.stroke();
}

let peopleColors = [];
let lastNamesSig = '';
// Each figure gets a wobble phase and period
let wobblePhases = [];
let wobblePeriods = [];
let heartRates = [];
let heartAmps = [];
let heartPhases = [];

function drawPeople(time) {
  const names = getNames();
  if (!names.length) return;

  // Doubled list for seamless scrolling (same as Banner)
  const doubled = [...names, ...names];

  // Assign stable colors and wobble params when names change
  const sig = names.join(',') + (randColors ? '1' : '0');
  if (sig !== lastNamesSig) {
    lastNamesSig = sig;
    peopleColors = doubled.map(() => randColors ? randomHex() : cfg.color);
    const basePhases = names.map((_, i) => i % 2 === 0 ? 0 : Math.PI);
    const basePeriods = names.map((_, i) => {
      if (i % 5 === 0) return 1.8;
      if (i % 3 === 0) return 2.5;
      return 2.0;
    });
    wobblePhases = [...basePhases, ...basePhases];
    wobblePeriods = [...basePeriods, ...basePeriods];
    const baseRates = names.map(() => 0.8 + Math.random() * 1.7);
    const baseAmps = names.map(() => 0.2 + Math.random() * 0.35);
    const baseHPhases = names.map(() => Math.random() * Math.PI * 2);
    heartRates = [...baseRates, ...baseRates];
    heartAmps = [...baseAmps, ...baseAmps];
    heartPhases = [...baseHPhases, ...baseHPhases];
  }
  for (let i = 0; i < doubled.length; i++) peopleColors[i] = cfg.figureColor;

  const figH = 1350 * 0.72;
  const s = figH / 188.5;
  const spacing = 120 * s;
  const groundY = 570 + figH / 2;
  const totalTrackW = doubled.length * spacing;
  const halfW = totalTrackW / 2;

  // Scroll speed controlled by figspeed slider
  const scrollDuration = names.length * (10 / cfg.figspeed);
  const scrollOffset = ((time / 1000) % scrollDuration) / scrollDuration * halfW;

  ctx.save();

  const nameSc = figH / 188.5 * 0.18;

  for (let i = 0; i < doubled.length; i++) {
    let cx = i * spacing - scrollOffset;
    while (cx < -spacing) cx += totalTrackW;
    while (cx > 1080 + spacing) cx -= totalTrackW;

    const wobbleAngle = Math.sin((time / 1000) * Math.PI / wobblePeriods[i] + wobblePhases[i]) * (8 * Math.PI / 180);

    ctx.save();
    ctx.translate(cx, groundY);
    ctx.rotate(wobbleAngle);

    drawFigureLocal(figH, peopleColors[i]);

    // Beating heart on chest — random rate and amplitude per figure
    const beat = Math.abs(Math.sin(time / 1000 * heartRates[i] * Math.PI + heartPhases[i]));
    const hsc = s * 0.65 * (1 + beat * heartAmps[i]);
    ctx.save();
    ctx.translate(12 * s, -figH + 95 * s);
    ctx.rotate(-Math.PI / 2);
    ctx.strokeStyle = cfg.heartColor;
    ctx.lineWidth = cfg.stroke;
    ctx.beginPath();
    ctx.moveTo(6 * hsc, -25 * hsc);
    ctx.lineTo(-29 * hsc, 0);
    ctx.lineTo(6 * hsc, 25 * hsc);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(11 * hsc, -13 * hsc, 18 * hsc, 12 * hsc, 0, Math.PI / 2, -Math.PI / 2, true);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(11 * hsc, 13 * hsc, 18 * hsc, 12 * hsc, 0, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();
    ctx.restore();

    // Name below feet as line segments, split into two lines
    const parts = doubled[i].split(' ');
    const line1 = parts[0] || '';
    const line2 = parts.slice(1).join(' ') || '';
    const lineH = 90 * nameSc + 12;
    const w1 = measureLineText(line1, nameSc);
    drawLineText(line1, -w1 / 2, 12, nameSc, cfg.nameColor);
    if (line2) {
      const w2 = measureLineText(line2, nameSc);
      drawLineText(line2, -w2 / 2, 12 + lineH, nameSc, cfg.nameColor);
    }

    ctx.restore();
  }

  ctx.restore();
}

function heartsOverlap(x, y, scale) {
  const minDist = 40 * scale;
  for (const h of hearts) {
    const dx = h.x - x;
    const dy = h.y - y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const need = minDist + 40 * h.scale;
    if (dist < need) return true;
  }
  return false;
}

function launch(x, y) {
  const scale = vary(cfg.len / 45, 0.5);
  let hx, hy, tries = 0;
  do {
    hx = (x !== undefined ? x : 100 + Math.random() * 880);
    hy = (y !== undefined ? y : 400 + Math.random() * 900);
    tries++;
  } while (heartsOverlap(hx, hy, scale) && tries < 20);
  if (tries < 20) hearts.push(new Heart(hx, hy));
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (1080 / rect.width);
  const y = (e.clientY - rect.top) * (1350 / rect.height);
  launch(x, y);
});

document.getElementById('btn-launch').addEventListener('click', () => launch());
document.getElementById('btn-clear').addEventListener('click', () => {
  hearts.length = 0;
});
const btnAuto = document.getElementById('btn-auto');
btnAuto.addEventListener('click', () => {
  autoMode = !autoMode;
  btnAuto.textContent = 'Auto: ' + (autoMode ? 'ON' : 'OFF');
});
const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', () => {
  paused = !paused;
  btnPause.textContent = paused ? 'Play' : 'Pause';
});

let supporterTotal = 76;

let lastTime = 0;
function frame(time) {
  requestAnimationFrame(frame);
  if (paused) { lastTime = time; return; }
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  // Clear — no transparency, full repaint
  ctx.fillStyle = cfg.bg;
  ctx.fillRect(0, 0, 1080, 1350);

  ctx.lineWidth = cfg.stroke;
  ctx.lineCap = 'butt';


  // Thank-you text at the top with letter-spacing
  ctx.font = "42px 'Times New Roman', Times, serif";
  ctx.textBaseline = 'top';
  const ls = 42 * 0.05;
  function drawSpaced(text, cx, y) {
    let totalW = 0;
    for (const ch of text) totalW += ctx.measureText(ch).width + ls;
    totalW -= ls;
    let x = cx - totalW / 2;
    for (const ch of text) {
      ctx.fillStyle = cfg.textColor;
      ctx.fillText(ch, x, y);
      ctx.strokeStyle = cfg.bg;
      ctx.lineWidth = 0.4;
      ctx.strokeText(ch, x, y);
      x += ctx.measureText(ch).width + ls;
    }
  }
  ctx.textAlign = 'left';
  const boxPad = 30;
  const boxTop = 30 - boxPad;
  const boxBot = 83 + 42 + boxPad;
  const boxLeft = boxPad;
  const boxRight = 1080 - boxPad;
  ctx.strokeStyle = cfg.borderColor;
  ctx.lineWidth = cfg.stroke;
  ctx.strokeRect(boxLeft, boxTop, boxRight - boxLeft, boxBot - boxTop);

  drawSpaced('We did it! A huge thank you to everyone', 540, 30);
  drawSpaced('who supported this campaign!', 540, 83);

  if (showPeople) drawPeople(time);

  // Bottom stats
  ctx.font = "42px 'Times New Roman', Times, serif";
  const lsB = 42 * 0.05;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  function drawStatChar(ch, x, y) {
    ctx.fillStyle = cfg.textColor;
    ctx.fillText(ch, x, y);
    ctx.strokeStyle = cfg.bg;
    ctx.lineWidth = 0.4;
    ctx.strokeText(ch, x, y);
  }
  let bx = 30;
  for (const ch of `${supporterTotal} Supporters`) {
    drawStatChar(ch, bx, 1350 - 30);
    bx += ctx.measureText(ch).width + lsB;
  }
  let rx = 1080 - 30;
  const rightText = '2000 EUR Collected';
  const rChars = [...rightText];
  let rWidths = rChars.map(ch => ctx.measureText(ch).width + lsB);
  let rTotal = rWidths.reduce((a, b) => a + b, 0) - lsB;
  let rStart = rx - rTotal;
  for (let i = 0; i < rChars.length; i++) {
    drawStatChar(rChars[i], rStart, 1350 - 30);
    rStart += rWidths[i];
  }
}
requestAnimationFrame(frame);
</script>
